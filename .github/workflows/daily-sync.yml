name: Daily Market Price Sync

on:
  schedule:
    # 04:00 UTC = 07:00 Israel Daylight Time (IDT) / 06:00 Israel Standard Time (IST)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "מקור הנתונים (sheet = משיכה מהירה מ-Google Sheets, hybrid = Sheets + סריקה חיה)"
        required: true
        default: "sheet"
        type: choice
        options:
          - sheet
          - hybrid
          - scrape
      mode:
        description: "היקף סריקה חיה (רלוונטי רק ב-hybrid / scrape)"
        required: true
        default: "dji"
        type: choice
        options:
          - dji
          - full

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Price Sync
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || '1pKIBLRiPc_JgznhfTw32DgDvLrb20qsYxBvFCp0St3I' }}
        run: |
          SOURCE="${{ github.event.inputs.source || 'sheet' }}"
          MODE="${{ github.event.inputs.mode || 'dji' }}"
          python run_sync.py --source "$SOURCE" --mode "$MODE"

      - name: Commit updated prices & cache
        run: |
          git config user.name "price-match-bot"
          git config user.email "actions@github.com"
          git add data/cache docs/data/prices.json
          git diff --staged --quiet || git commit -m "chore: daily price sync ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
